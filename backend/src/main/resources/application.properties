server.port=${PORT:8080}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Datasource is configured programmatically via DataSourceConfig which reads DATABASE_URL

# Flyway: when schema is non-empty (existing tables created by Hibernate), initialize
# the Flyway schema history table and then apply migrations.
spring.flyway.baseline-on-migrate=true
