services:
  - type: web
    name: flutter-tweeter-backend
    env: docker
    branch: main
    autoDeploy: true
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        value: "<PASTE_AIVEN_DATABASE_URL_HERE>"
        scope: env
      - key: JWT_SECRET
        value: "<SET_A_STRONG_SECRET>"
        scope: env
      - key: FRONTEND_ORIGIN
        value: "<OPTIONAL_FRONTEND_ORIGIN>"
        scope: env
