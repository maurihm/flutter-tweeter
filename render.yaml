services:
  - type: web
    name: flutter-tweeter-backend
    env: docker
    branch: main
    autoDeploy: true
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://flutter-tweeter-web.onrender.com

  - type: web
    name: flutter-tweeter-web
    env: docker
    branch: main
    autoDeploy: true
    plan: free
    rootDir: .
    dockerfilePath: frontend.Dockerfile
    dockerContext: .
    envVars:
      - key: API_BASE_URL
        value: https://flutter-tweeter-backend.onrender.com
