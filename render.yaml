services:
  - type: web
    name: flutter-tweeter-backend
    env: docker
    branch: main
    autoDeploy: true
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
